services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plausibil
      POSTGRES_USER: plausibil
      POSTGRES_PASSWORD: plausibil
    ports:
      - "5432:5432"
    volumes:
      - plausibil_db:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://plausibil:plausibil@db:5432/plausibil
      CORS_ORIGINS: http://localhost:5173
      UPLOAD_DIR: /app/data/raw
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - db

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  plausibil_db:
